<!DOCTYPE html>
<html>
<head>
    <title>Job Board</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">

        <h1>Tech Job Board</h1>

        <a class="top-link" href="{{ url_for('add') }}">+ Add Job</a>

        <h2>Available Jobs</h2>

        <form method="GET" class="search-bar">
            <input
                type="text"
                name="search"
                placeholder="Search jobs..."
                value="{{ request.args.get('search', '') }}"
            >
            <button type="submit">Search</button>
        </form>

        {% for job in jobs %}

        <div class="job-card">

            <h3>{{ job.title }}</h3>

            <p><strong>{{ job.company }}</strong></p>

            <p>{{ job.location }}</p>

            <p>
                {{ job.salary or "Salary not specified" }}
            </p>

            <p>
                {{ job.description or "No description provided." }}
            </p>

            <div class="job-actions">

                <a class="edit" href="{{ url_for('edit_job', job_id=job.id) }}">
                    Edit
                </a>

                <form
                    method="POST"
                    action="{{ url_for('delete_job', job_id=job.id) }}"
                    class="delete-form"
                >
                    <button type="submit" class="delete">
                        Delete
                    </button>
                </form>

            </div>

        </div>

        {% else %}

        <p>No jobs found.</p>

        {% endfor %}

    </div>
</body>
</html>
